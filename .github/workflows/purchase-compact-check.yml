name: Purchase Compact Checkout Check

on:
  pull_request:
    paths:
      - 'src/pages/PurchaseEditor.tsx'
      - 'src/components/purchases/**'
      - 'src/components/AmountInWordsDisplay.tsx'
      - 'scripts/purchase-compact-checkout-browser.cjs'
      - 'tests/amountInWordsDisplayContract.test.ts'
      - 'package.json'
      - '.github/workflows/purchase-compact-check.yml'

permissions:
  contents: read

jobs:
  purchase-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:ui-contract
      - run: npx playwright install --with-deps chromium
      - name: Verify mint summary, amount in words, split payments and mobile geometry
        run: npm run test:purchase-compact
      - name: Verify purchase editor, supplier and POS integrations
        run: npm run test:purchases
      - name: Verify Vendor embedded purchase workspace
        run: npm run test:vendor-context
