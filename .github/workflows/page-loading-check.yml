name: Page Loading Check
on:
  pull_request:
    paths: ['src/App.tsx', 'src/components/layout/**', 'src/saas/SaasShell.tsx', 'scripts/page-loading-browser.cjs', '.github/workflows/page-loading-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/page-loading-browser.cjs
      - run: node scripts/receipt-preview-browser.cjs
