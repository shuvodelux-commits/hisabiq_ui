name: Deep Finance Actions Check
on:
  pull_request:
    paths:
      - 'src/pages/Finance.tsx'
      - 'src/components/finance/FinanceRecordDialogs.tsx'
      - 'scripts/deep-finance-actions-browser.cjs'
      - '.github/workflows/deep-finance-actions-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-finance-actions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-finance-actions-evidence
          path: .superpowers/deep-audit/finance-actions
          include-hidden-files: true
          if-no-files-found: error
