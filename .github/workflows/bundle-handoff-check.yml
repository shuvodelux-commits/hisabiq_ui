name: Bundle Handoff Check
on:
  pull_request:
    paths:
      - 'src/bundles/bundleHandoff.ts'
      - 'src/quotations/**'
      - 'src/onlineSales/**'
      - 'src/pages/Quotations.tsx'
      - 'src/pages/OnlineSales.tsx'
      - 'src/pages/Pos.tsx'
      - 'tests/bundleHandoff.test.ts'
      - 'scripts/bundle-handoff-browser.cjs'
      - '.github/workflows/bundle-handoff-check.yml'
jobs:
  quote-online-pos:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and test handoff context
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test tests/bundleHandoff.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Verify quote, online and POS mobile review
        run: node scripts/bundle-handoff-browser.cjs
