name: Installment Collections Preview Check
on:
  pull_request:
    paths:
      - 'src/installments/**'
      - 'src/data/installmentPreviewStore.ts'
      - 'src/components/pos/Installment*'
      - 'src/pages/Pos.tsx'
      - 'tests/installment*'
      - 'scripts/installment-payment-browser.cjs'
      - '.github/workflows/installment-collection-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:ui-contract
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/installment-pos-browser.cjs
      - run: node scripts/installment-payment-browser.cjs
