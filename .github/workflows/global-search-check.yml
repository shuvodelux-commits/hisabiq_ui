name: Global Search Check
on:
  pull_request:
    paths: ['src/components/layout/TopBar.tsx', 'src/pages/GlobalSearch.tsx', 'src/pages/Products.tsx', 'src/pages/Sales.tsx', 'src/pages/Purchases.tsx', 'src/utils/globalSearch.ts', 'scripts/global-search-browser.cjs', 'tests/globalSearch.test.ts', '.github/workflows/global-search-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --experimental-strip-types --test tests/globalSearch.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/global-search-browser.cjs
      - run: node scripts/phone-header-browser.cjs
      - run: node scripts/page-loading-browser.cjs
