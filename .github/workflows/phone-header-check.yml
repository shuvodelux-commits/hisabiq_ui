name: Phone Header Check
on:
  pull_request:
    paths:
      - 'src/components/layout/TopBar.tsx'
      - 'scripts/phone-header-browser.cjs'
      - '.github/workflows/phone-header-check.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/phone-header-browser.cjs
