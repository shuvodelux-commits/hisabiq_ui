name: Deep Cheque Lifecycle Check
on:
  pull_request:
    paths:
      - 'src/pages/Finance.tsx'
      - 'src/components/finance/**'
      - 'src/utils/chequeAccount.ts'
      - 'tests/chequeAccount.test.ts'
      - 'src/components/Dialog.tsx'
      - 'src/index.css'
      - 'scripts/deep-cheque-lifecycle-browser.cjs'
      - '.github/workflows/deep-cheque-lifecycle-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-cheque-lifecycle-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-cheque-lifecycle-evidence
          path: .superpowers/deep-audit/cheque-lifecycle
          include-hidden-files: true
          if-no-files-found: error
