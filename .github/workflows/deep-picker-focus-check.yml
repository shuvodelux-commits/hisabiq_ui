name: Deep Picker Focus Check
on:
  pull_request:
    paths:
      - 'src/components/pos/**'
      - 'src/components/purchases/**'
      - 'src/components/transactions/**'
      - 'src/components/Dialog.tsx'
      - 'scripts/deep-picker-focus-browser.cjs'
      - '.github/workflows/deep-picker-focus-check.yml'
jobs:
  interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-picker-focus-browser.cjs
      - name: Save measured journeys and failure screenshots/traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-picker-focus-evidence
          path: .superpowers/deep-audit/picker-focus
          if-no-files-found: error
