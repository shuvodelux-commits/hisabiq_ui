name: Bundle Editor Check
on:
  pull_request:
    paths:
      - 'src/bundles/**'
      - 'src/components/products/BundleEditor.tsx'
      - 'src/components/pos/CartTable.tsx'
      - 'src/components/pos/ProductCombobox.tsx'
      - 'src/pages/Products.tsx'
      - 'src/pages/Pos.tsx'
      - 'src/data/productImportPreviewStore.ts'
      - 'src/i18n/productsCopy.ts'
      - 'scripts/bundle-editor-browser.cjs'
      - 'tests/bundle*.test.ts'
      - '.github/workflows/bundle-editor-check.yml'
jobs:
  bundle-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify bundle recipe and cost unit tests
        run: node --experimental-strip-types --test tests/bundle*.test.ts
      - name: Verify bundle editor, mobile overlays, POS eye and lifecycle
        run: node scripts/bundle-editor-browser.cjs
