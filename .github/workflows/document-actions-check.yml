name: Document Actions Check
on:
  pull_request:
    paths:
      - 'src/pages/Sales.tsx'
      - 'src/pages/Warranty.tsx'
      - 'src/pages/Products.tsx'
      - 'src/pages/Reports.tsx'
      - 'src/pages/Accounts.tsx'
      - 'src/components/brand/ReceiptPreview.tsx'
      - 'src/components/brand/printReceipt.tsx'
      - 'src/utils/salesDocuments.ts'
      - 'scripts/document-actions-browser.cjs'
      - 'scripts/receipt-preview-browser.cjs'
      - 'tests/salesDocuments.test.ts'
      - '.github/workflows/document-actions-check.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --experimental-strip-types --test tests/salesDocuments.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/document-actions-browser.cjs
      - run: npm run build
      - run: node scripts/receipt-preview-browser.cjs
