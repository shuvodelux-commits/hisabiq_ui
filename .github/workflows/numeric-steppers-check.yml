name: Numeric Steppers Check
on:
  pull_request:
    paths: ['src/components/Input.tsx', 'src/components/NumericInput.tsx', 'src/components/MoneyUnitInput.tsx', 'src/components/transactions/**', 'src/components/pos/**', 'src/components/purchases/**', 'src/index.css', 'src/utils/numericStep.ts', 'tests/numericStep.test.ts', 'scripts/numeric-steppers-browser.cjs', 'scripts/field-alignment-browser.cjs', 'tests/fieldAlignmentContract.test.ts', 'scripts/pos-responsive-cart-browser.cjs', 'scripts/shared-cart-responsive-browser.cjs', '.github/workflows/numeric-steppers-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/numericStep.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/shared-cart-responsive-browser.cjs
      - run: node scripts/numeric-steppers-browser.cjs
      - run: node scripts/mobile-carts-browser.cjs
      - run: node scripts/pos-responsive-cart-browser.cjs
      - run: npm run test:compound-units
      - run: npm run test:product-quick-add
      - run: npm run test:field-alignment
