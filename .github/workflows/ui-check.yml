name: UI Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test UI helpers and theme palette
        run: npm test

      - name: Build UI
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check rendered light and dark themes
        run: npm run test:theme

      - name: Check SaaS administration journeys and contrast
        run: npm run test:saas

      - name: Check ERP settings workflows and contrast
        run: npm run test:settings

      - name: Check full-page purchase and quick-add workflow
        run: npm run test:purchases
