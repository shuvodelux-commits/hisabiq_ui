name: Framer Motion Navigation Check
on:
  pull_request:
    paths:
      - 'src/motion/**'
      - 'src/components/layout/**'
      - 'src/components/NumericInput.tsx'
      - 'src/components/parties/PartyDetail.tsx'
      - 'src/components/vendor/VendorTabs.tsx'
      - 'src/components/products/ProductSettings.tsx'
      - 'src/pages/**'
      - 'src/index.css'
      - 'scripts/motion-navigation-browser.cjs'
      - 'scripts/sidebar-interaction-browser.cjs'
      - 'tests/motionTabContract.test.ts'
      - '.github/workflows/framer-motion-check.yml'
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:ui-contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:motion-navigation
      - run: npm run test:sidebar-interactions
      - run: node scripts/numeric-steppers-browser.cjs
      - run: npm run test:sidebar-target-size
      - run: npm run test:erp-navigation
      - run: npm run test:vendor-party-layout
