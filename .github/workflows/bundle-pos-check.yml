name: Bundle POS Check
on:
  pull_request:
    paths:
      - 'src/bundles/**'
      - 'src/components/brand/ReceiptPreview.tsx'
      - 'src/components/pos/**'
      - 'src/hooks/usePosCart.ts'
      - 'src/pages/Pos.tsx'
      - 'src/types/erp.ts'
      - 'scripts/bundle-pos-browser.cjs'
      - 'tests/bundleCart.test.ts'
      - 'tests/bundleDocuments.test.ts'
      - '.github/workflows/bundle-pos-check.yml'
jobs:
  bundle-sale-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and validate bundle POS calculations
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test tests/bundleCart.test.ts tests/bundleDocuments.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Verify POS bundle sale preview and phone/tablet flow
        run: node scripts/bundle-pos-browser.cjs
