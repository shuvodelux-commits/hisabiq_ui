name: Select Contract Check
on:
  pull_request:
    paths:
      - 'src/components/FormSelect.tsx'
      - 'src/components/parties/LedgerTable.tsx'
      - 'src/utils/partyActions.ts'
      - 'scripts/select-contract-browser.cjs'
      - '.github/workflows/select-contract-check.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/select-contract-browser.cjs
