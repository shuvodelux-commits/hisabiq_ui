name: Authentication UI Preview Check

on:
  pull_request:
    paths:
      - 'src/features/auth/**'
      - 'src/App.tsx'
      - 'src/components/Input.tsx'
      - 'scripts/auth-login-browser.cjs'
      - '.github/workflows/auth-ui-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    name: Signup, login, recovery browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify auth UI states
        env:
          AUTH_SCREENSHOT_DIR: auth-ui-screenshots
        run: npm run test:auth-login
      - name: Publish review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-auth-ui-screenshots
          path: auth-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
