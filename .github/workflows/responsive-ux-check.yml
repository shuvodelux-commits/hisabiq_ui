name: Responsive UX Check
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/responsive-audit-browser.cjs'
      - 'scripts/dialog-accessibility-browser.cjs'
      - '.github/workflows/responsive-ux-check.yml'
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/responsive-audit-browser.cjs
      - run: node scripts/dialog-accessibility-browser.cjs
