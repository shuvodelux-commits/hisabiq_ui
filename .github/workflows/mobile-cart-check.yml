name: Mobile Cart Check
on:
  pull_request:
    paths:
      - 'src/components/pos/CartTable.tsx'
      - 'src/components/purchases/PurchaseCart.tsx'
      - 'src/components/transactions/TransactionCartEditor.tsx'
      - 'src/index.css'
      - 'scripts/mobile-carts-browser.cjs'
      - '.github/workflows/mobile-cart-check.yml'
jobs:
  carts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/mobile-carts-browser.cjs
