name: Deep Finance Table Scroll Check
on:
  pull_request:
    paths:
      - 'src/components/Table.tsx'
      - 'src/pages/Finance.tsx'
      - 'scripts/deep-finance-table-scroll-browser.cjs'
      - 'package.json'
      - '.github/workflows/deep-finance-table-scroll-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deep-finance-table-scroll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-finance-table-scroll-evidence
          path: .superpowers/deep-audit/finance-table-scroll
          include-hidden-files: true
          if-no-files-found: error
